<template>
  <div class="b2b-forgot-password">
    <h1>{label.heading}</h1>

    <template if:false={isSuccess}>
      <p>{label.instructions}</p>

      <div
        if:true={formError}
        data-id="form-error"
        class="b2b-forgot-password__error"
        role="alert"
      >
        {formError}
      </div>

      <form onsubmit={handleSubmit} novalidate>
        <div class="b2b-forgot-password__field">
          <label for="email-input">{label.emailLabel}</label>
          <input
            type="email"
            id="email-input"
            data-id="email-input"
            value={email}
            onchange={handleEmailChange}
            aria-invalid={isEmailInvalid}
            aria-describedby={emailErrorId}
          />
          <div
            if:true={emailError}
            data-id="email-error"
            id="email-error"
            class="b2b-forgot-password__field-error"
          >
            {emailError}
          </div>
        </div>

        <button
          type="submit"
          data-id="submit-button"
          disabled={isSubmitting}
          class="b2b-forgot-password__submit"
        >
          {label.submitButtonLabel}
        </button>
      </form>
    </template>

    <div
      if:true={isSuccess}
      data-id="success-message"
      class="b2b-forgot-password__success"
      role="status"
    >
      {successMessage}
    </div>

    <a
      href={loginUrl}
      data-id="back-to-login-link"
      class="b2b-forgot-password__back-link"
    >
      {label.backToLoginLabel}
    </a>
  </div>
</template>
